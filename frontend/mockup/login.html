<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaultShare - Log in</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class ="auth-page">
    
  <main class="auth-card">
    <h1>VaultShare</h1>
    <p class="tagline">Your files, encrypted and shared safely</p>
    

    <form action="vault.html">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password"> 

      
      <button type="submit">Log in</button>
    </form>

    <p>
        Don't have an account? 
        <a href="signup.html">Create one</a>
    </p>
    

    <div class="note-box">
        <strong>Note:</strong> Your files are encrypted before they leave your device.
    </div>
    
  </main>

</body>
</html>
