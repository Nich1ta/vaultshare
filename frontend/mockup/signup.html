<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaultShare - Sign up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    
  <main class="auth-card">
    <h1>VaultShare</h1>
    <p class="tagline">Create your encrypted vault.</p>
    

    <form>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required autocomplete="name">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="new-password">

      <label for="confirm-password">Confirm password</label>
      <input type="password" id="confirm-password" name="confirm-password" required autocomplete="new-password">
      
      <button type="submit">Create account</button>
    </form>
    <p>
  Already have an account?
  <a href="login.html">Log in</a>
</p>
    <div class="note-box">
        <strong>Note:</strong> Your password also protects your encryption key. If you forget it, your files can't be recovered, so you'll get a recovery key after sign-up.
    </div>
    
  </main>

</body>
</html>
